    <meta charset="utf-8">

    <meta name="description" content="SHANE 產品體驗架構計畫，協助 SaaS、AI 與新創團隊釐清品牌定位、產品策略與 UX 架構。">
    <title>SHANE｜產品體驗架構計畫</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      :root {
        --ink: #f1f0ed;
        --muted: #9a9a9a;
        --line: rgba(255, 255, 255, .22);
        --line-soft: rgba(255, 255, 255, .1);
        --surface: rgba(255, 255, 255, .018);
        --black: #070809;
      }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 75% 13%, rgba(255,255,255,.035), transparent 23%),
          radial-gradient(circle at 22% 59%, rgba(255,255,255,.025), transparent 25%),
          var(--black);
        font-family: "Noto Sans TC", sans-serif;
        font-weight: 300;
        letter-spacing: .075em;
        overflow-x: hidden;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        content: "";
        opacity: .11;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");
      }

      a { color: inherit; text-decoration: none; }
      p { color: var(--muted); line-height: 1.9; }
      section { position: relative; scroll-margin-top: 76px; }

      .container-wide {
        width: min(1500px, calc(100% - 48px));
        margin-inline: auto;
      }

      .section-pad { padding: 104px 0; }
      .serif { font-family: "Noto Serif TC", serif; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 28px;
        color: #b8b8b8;
        font-size: .92rem;
        letter-spacing: .24em;
      }

      .eyebrow::after {
        width: min(280px, 30vw);
        height: 1px;
        content: "";
        background: linear-gradient(90deg, var(--line), transparent);
      }

      .display-title {
        margin: 0;
        font-size: clamp(2.25rem, 4vw, 4.25rem);
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: .035em;
      }

      .section-title {
        margin-bottom: 32px;
        font-size: clamp(2rem, 3.25vw, 3.35rem);
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: .04em;
      }

      .navbar-shane {
        min-height: 88px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line-soft);
        background: rgba(7,8,9,.9);
        backdrop-filter: blur(14px);
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 17px;
        color: #f7f7f5 !important;
        font-size: 1rem;
        letter-spacing: .42em;
      }

      .brand-mark {
        position: relative;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 50%;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        border-radius: 50%;
        content: "";
      }

      .brand-mark::before {
        inset: 8px 10px;
        border: 1px solid rgba(255,255,255,.65);
      }

      .brand-mark::after {
        top: 9px;
        right: 8px;
        width: 15px;
        height: 22px;
        background: #efefed;
        box-shadow: -8px 4px 14px rgba(255,255,255,.22);
      }

      .navbar-shane .nav-link {
        padding: 12px 21px !important;
        color: #bbb !important;
        font-size: .88rem;
        letter-spacing: .12em;
        transition: color .25s ease;
      }

      .navbar-shane .nav-link:hover { color: #fff !important; }

      .nav-cta {
        margin-left: 20px;
        padding: 13px 25px;
        border: 1px solid rgba(255,255,255,.64);
        color: #fff;
        font-size: .88rem;
        transition: .25s ease;
      }

      .nav-cta:hover { color: #080808; background: #f4f3f0; }

      .navbar-toggler { border-color: rgba(255,255,255,.25); }
      .navbar-toggler:focus { box-shadow: none; }

      /* Hero */
      .hero {
        display: flex;
        align-items: center;
        min-height: calc(100vh - 88px);
        padding: 72px 0;
        overflow: hidden;
      }

      .hero-copy { position: relative; z-index: 3; }
      .hero-copy .lead-copy { max-width: 660px; margin: 28px 0 34px; }

      .primary-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        padding: 0 42px;
        border: 1px solid #f2f1ef;
        color: #101010;
        background: #f2f1ef;
        letter-spacing: .11em;
        transition: .25s ease;
      }

      .primary-cta:hover {
        color: #fff;
        background: transparent;
        transform: translateY(-2px);
      }

      .availability {
        display: inline-block;
        margin-left: 20px;
        padding-left: 20px;
        border-left: 1px solid var(--line);
        color: #bbb;
        font-size: .87rem;
      }

      .tag-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 38px; }
      .tag-pill {
        min-width: 108px;
        padding: 9px 22px;
        border: 1px solid var(--line);
        border-radius: 99px;
        color: #aaa;
        text-align: center;
        font-size: .83rem;
      }

      .hero-space {
        position: relative;
        min-height: 700px;
      }

      .moon-main {
        position: absolute;
        top: 10%;
        left: 10%;
        width: min(570px, 38vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background-image: url("img/moon-hero01.png");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        filter: grayscale(1) contrast(1.04);
        box-shadow: 24px 0 50px rgba(255,255,255,.12), inset -25px 0 55px rgba(0,0,0,.5);
      }

      .orbit,
      .orbit::before,
      .orbit::after {
        position: absolute;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 50%;
        content: "";
      }

      .orbit {
        inset: 1% -2% 4% -7%;
        transform: rotate(-17deg);
      }

      .orbit::before { inset: 12%; border-style: dashed; }
      .orbit::after { inset: 28%; border-color: rgba(255,255,255,.1); }

      .orbit-dot {
        position: absolute;
        width: 9px;
        height: 9px;
        border: 2px solid #bebebe;
        border-radius: 50%;
        background: #080909;
      }

      .orbit-dot.one { top: 28%; right: 2%; }
      .orbit-dot.two { right: 9%; bottom: 23%; }
      .orbit-dot.three { bottom: 14%; left: 12%; width: 6px; height: 6px; background: #aaa; }

      .hero-signature {
        position: absolute;
        right: 8%;
        bottom: 9%;
        width: 300px;
        color: #aaa;
        font-size: .78rem;
        letter-spacing: .18em;
      }

      .hero-signature span { display: block; margin-bottom: 8px; color: #d2d2d2; }
      .hero-signature::after { display: block; width: 100%; height: 1px; margin-top: 18px; content: ""; background: var(--line); }

      /* Problem */
      .problem-visual {
        min-height: 690px;
        background-image: linear-gradient(90deg, transparent 75%, var(--black)), url("img/rem.png");
        background-repeat: no-repeat;
        background-position: left center;
        background-size: auto 100%;
        filter: grayscale(1);
      }

      .problem-list { display: grid; gap: 16px; }
      .problem-card {
        display: grid;
        grid-template-columns: 74px 1px 1fr;
        gap: 26px;
        align-items: stretch;
        padding: 22px 30px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: linear-gradient(120deg, rgba(255,255,255,.012), transparent);
      }

      .problem-card .number { padding-top: 4px; color: #bebebe; font-size: 1.1rem; letter-spacing: .08em; }
      .problem-card .divider { background: var(--line-soft); }
      .problem-card h3 { margin: 0 0 7px; color: #bebebe; font-size: 1rem; font-weight: 300; letter-spacing: .08em; }
      .problem-card p { margin: 0; font-size: .92rem; line-height: 1.75; }

      /* Belief */
      .belief-section { overflow: hidden; }
      .golden-visual {
        min-height: 650px;
        background-image: linear-gradient(90deg, transparent 77%, var(--black)), url("img/shape.png");
        background-repeat: no-repeat;
        background-position: left 44%;
        background-size: auto 100%;
        filter: grayscale(1);
      }

      .belief-list { display: grid; gap: 14px; }
      .belief-card {
        position: relative;
        padding: 27px 35px 26px 128px;
        border: 1px solid var(--line);
        min-height: 170px;
      }

      .phase-icon {
        position: absolute;
        top: 29px;
        left: 38px;
        width: 50px;
        height: 50px;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 50%;
      }

      .phase-icon.half { background: linear-gradient(90deg, transparent 50%, #cfcfcd 50%); }
      .phase-icon.full { background: radial-gradient(circle at 65% 35%, #eee, #777 72%, #333); }
      .belief-card h3 { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-family: "Noto Serif TC", serif; font-size: 1.4rem; font-weight: 400; }
      .belief-card h3::after { flex: 1; height: 1px; content: ""; background: linear-gradient(90deg, var(--line), transparent); }
      .belief-card p { margin: 0; font-size: .9rem; line-height: 1.75; }

      /* Focus */
      .focus-section { overflow: hidden; }
      .focus-section::before,
      .focus-section::after {
        position: absolute;
        top: 5%;
        width: 340px;
        height: 620px;
        border: 1px dashed rgba(255,255,255,.14);
        border-radius: 50%;
        content: "";
      }
      .focus-section::before { left: -270px; }
      .focus-section::after { right: -270px; }

      .focus-head { text-align: center; }
      .focus-head .eyebrow { justify-content: center; }
      .focus-head .eyebrow::after { display: none; }
      .focus-sub { margin-bottom: 46px; color: #858585; letter-spacing: .4em; font-size: .76rem; }

      .focus-card {
        height: 100%;
        padding: 16px 16px 30px;
        border: 1px solid var(--line);
        border-radius: 11px;
        text-align: center;
      }

      .phase-track { position: relative; height: 72px; }
      .phase-track::before {
        position: absolute;
        top: 38px;
        left: 18%;
        right: 18%;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, var(--line), transparent);
      }

      .phase-track::after {
        position: absolute;
        top: 31px;
        left: 48%;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        content: "";
        background: radial-gradient(circle at 70% 35%, #e1e1df, #666 60%, #111 63%);
      }

      .mockup {
        height: 215px;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 12px;
        background-image: url("img/plan.png");
        background-repeat: no-repeat;
        background-size: 1680px 945px;
        filter: grayscale(1) brightness(.75);
      }
      .mockup.one { background-position: -168px -360px; }
      .mockup.two { background-position: -616px -360px; }
      .mockup.three { background-position: -1097px -360px; }
      .focus-card h3 { margin: 14px 0 4px; font-size: 1.85rem; font-weight: 400; }
      .focus-card .subtitle { margin-bottom: 12px; color: #858585; letter-spacing: .12em; }
      .focus-card .rule { width: 70%; height: 1px; margin: 0 auto 12px; background: var(--line-soft); }
      .focus-card p { margin: 0; font-size: .84rem; line-height: 1.8; }

      .focus-note {
        margin-top: 28px;
        padding: 20px 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #aaa;
        text-align: center;
        font-size: .9rem;
      }

      /* Proof */
      .proof-section { overflow: hidden; }
      .proof-section::after {
        position: absolute;
        top: -70px;
        right: -210px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        content: "";
        background-image: url("img/shape.png");
        background-position: 6% 43%;
        background-size: 260% auto;
        filter: grayscale(1) brightness(.6);
        opacity: .72;
      }

      .proof-panel {
        position: relative;
        z-index: 2;
        height: 100%;
        padding: 38px 44px;
        border: 1px solid rgba(255,255,255,.32);
        border-radius: 4px;
        background: rgba(7,8,9,.56);
      }

      .proof-panel h3 { margin-bottom: 30px; font-size: 1.45rem; font-weight: 400; }
      .work-shot {
        height: 290px;
        border: 1px solid var(--line);
        background-image: url("img/project.png");
        background-repeat: no-repeat;
        background-size: 1680px 945px;
        filter: grayscale(1) brightness(.82);
      }
      .work-shot.one { background-position: -100px -324px; }
      .work-shot.two { background-position: -385px -324px; }
      .work-shot.three { background-position: -671px -324px; }
      .work-name { margin: 12px 0 10px; font-family: Georgia, "Noto Serif TC", serif; font-size: 1.25rem; text-align: center; }
      .work-desc { margin: 0; font-size: .81rem; text-align: center; line-height: 1.7; }

      .boundary-list { margin-top: 10px; }
      .boundary-item {
        display: grid;
        grid-template-columns: 42px 1fr;
        gap: 20px;
        align-items: center;
        padding: 20px 0;
        border-bottom: 1px solid var(--line-soft);
        color: #a8a8a8;
        font-size: .9rem;
      }
      .check {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.65);
        border-radius: 50%;
        color: #fff;
      }
      .statement {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid rgba(255,255,255,.45);
        box-shadow: 8px 8px 0 -2px var(--black), 8px 8px 0 -1px rgba(255,255,255,.25);
        font-size: 1.5rem;
        line-height: 1.7;
        text-align: center;
      }

      /* CTA */
      .cta-section { overflow: hidden; }
      .cta-section::after {
        position: absolute;
        top: 20px;
        right: -260px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        content: "";
        background-image: url("img/shape.png");
        background-position: 6% 43%;
        background-size: 260% auto;
        filter: grayscale(1) brightness(.65);
        opacity: .72;
      }

      .cta-heading { position: relative; z-index: 2; text-align: center; }
      .cta-heading .eyebrow { justify-content: center; }
      .cta-heading .eyebrow::after { display: none; }

      .booking-panel {
        position: relative;
        z-index: 2;
        margin-top: 58px;
        padding: 46px 60px;
        border: 1px solid rgba(255,255,255,.38);
        border-radius: 7px;
        background: rgba(7,8,9,.62);
      }

      .benefit-list { padding-right: 40px; border-right: 1px solid var(--line); }
      .benefit {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 24px;
        align-items: center;
        padding: 18px 0 28px;
      }
      .benefit + .benefit { border-top: 1px solid var(--line-soft); }
      .benefit-icon {
        display: grid;
        width: 74px;
        height: 74px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
      }
      .benefit-icon svg { width: 37px; height: 37px; stroke: #eee; }
      .benefit h3 { margin: 0 0 8px; font-family: "Noto Serif TC", serif; font-size: 1.32rem; font-weight: 400; }
      .benefit p { margin: 0; font-size: .82rem; }

      .booking-form { padding-left: 38px; }
      .booking-form label { margin-bottom: 8px; color: #b5b5b5; font-size: .84rem; }
      .booking-form .form-control {
        min-height: 58px;
        padding: 14px 18px;
        border: 1px solid rgba(255,255,255,.3);
        border-radius: 0;
        color: #eee;
        background: rgba(0,0,0,.32);
        font-weight: 300;
        letter-spacing: .05em;
      }
      .booking-form textarea.form-control { min-height: 94px; }
      .booking-form .form-control:focus { border-color: rgba(255,255,255,.75); box-shadow: none; background: rgba(0,0,0,.42); }
      .booking-form .form-control::placeholder { color: #666; }
      .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 60px;
        margin-top: 20px;
        border: 1px solid #f4f3f0;
        color: #111;
        background: #f4f3f0;
        font-size: 1rem;
        letter-spacing: .09em;
        transition: .25s ease;
      }
      .submit-btn:hover { color: #fff; background: transparent; }
      .form-note { margin: 14px 0 0; color: #7e7e7e; font-size: .76rem; text-align: center; line-height: 1.6; }

      footer {
        padding: 28px 0;
        border-top: 1px solid var(--line-soft);
        color: #666;
        font-size: .74rem;
        text-align: center;
      }

      @media (max-width: 1199.98px) {
        .navbar-collapse { padding: 20px 0; }
        .nav-cta { display: inline-block; margin: 8px 0 0 20px; }
        .hero-space { min-height: 560px; }
        .moon-main { width: min(500px, 48vw); }
        .problem-visual, .golden-visual { min-height: 570px; }
        .proof-panel { padding: 30px 25px; }
        .work-shot { height: 220px; }
        .booking-panel { padding: 38px 32px; }
      }

      @media (max-width: 991.98px) {
        .section-pad { padding: 80px 0; }
        .hero { padding-top: 50px; }
        .hero-space { min-height: 590px; margin-top: 20px; }
        .moon-main { left: 16%; width: min(540px, 66vw); }
        .hero-signature { right: 12%; }
        .problem-visual, .golden-visual { min-height: 540px; margin-bottom: 20px; background-size: auto 100%; }
        .focus-card { margin-bottom: 20px; }
        .proof-panel { margin-bottom: 22px; }
        .benefit-list { padding-right: 0; border-right: 0; border-bottom: 1px solid var(--line); }
        .booking-form { padding: 34px 0 0; }
      }

      @media (max-width: 767.98px) {
        body { letter-spacing: .04em; }
        .container-wide { width: min(100% - 30px, 1500px); }
        .navbar-shane { min-height: 72px; }
        .navbar-brand { font-size: .88rem; }
        .brand-mark { width: 36px; height: 36px; }
        .section-pad { padding: 64px 0; }
        .display-title { font-size: clamp(2rem, 10vw, 3rem); }
        .section-title { font-size: clamp(1.85rem, 8.5vw, 2.8rem); }
        .eyebrow { font-size: .78rem; gap: 12px; letter-spacing: .15em; }
        .hero { min-height: auto; }
        .primary-cta { width: 100%; padding: 0 16px; }
        .availability { display: block; margin: 14px 0 0; padding: 0; border: 0; text-align: center; }
        .tag-row { justify-content: center; }
        .tag-pill { min-width: calc(50% - 8px); }
        .hero-space { min-height: 420px; }
        .moon-main { top: 5%; left: 9%; width: 82vw; }
        .hero-signature { right: 4%; bottom: 5%; width: 230px; }
        .problem-visual, .golden-visual { min-height: 390px; margin-inline: -15px; }
        .problem-card { grid-template-columns: 46px 1px 1fr; gap: 15px; padding: 20px 17px; }
        .belief-card { padding: 90px 22px 24px; }
        .phase-icon { top: 23px; left: 22px; }
        .focus-sub { letter-spacing: .2em; }
        .mockup { background-size: 1320px auto; }
        .mockup.one { background-position: -130px -281px; }
        .mockup.two { background-position: -482px -281px; }
        .mockup.three { background-position: -862px -281px; }
        .proof-panel { padding: 26px 18px; }
        .work-shot { max-width: 290px; height: 280px; margin: 0 auto; }
        .booking-panel { margin-top: 35px; padding: 26px 18px; }
        .benefit { grid-template-columns: 70px 1fr; gap: 16px; }
        .benefit-icon { width: 60px; height: 60px; }
        .benefit-icon svg { width: 30px; height: 30px; }
        .statement { font-size: 1.2rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-xl navbar-dark navbar-shane sticky-top">
      <div class="container-wide">
        <a class="navbar-brand" href="#top" aria-label="SHANE 首頁">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>SHANE</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="開啟導覽選單">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
